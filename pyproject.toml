# ==========================================================
# Ruff — R3-ruff-ble001-coverage
# Baseline gate: high-signal rules only (F = real errors, BLE001 = blind-except).
# Ramp history: R4 added I (imports) + UP (pyupgrade); R5 added B904 (raise-from).
# Future ramp (R6+): B (remaining bugbear), SIM, E501.
# ==========================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "webcloring-pdf",
    ".venv",
    ".smoke-venv",
    ".smoke-venv2",
    "dist",
    "build",
    "docs",
    "logs",
    ".pytest_tmp",
    "__pycache__",
]

[tool.ruff.lint]
# R4-import-pyupgrade-ramp: I(import sorting) + UP(pyupgrade) added to the gate.
# UP035(deprecated-import) is included too: deferring it leaves `from typing import
# Dict/List` while UP006 rewrites bodies to `dict/list`, which would orphan those
# imports as F401. Including UP035 keeps the gate self-consistent. Its fix is
# "unsafe"-classified; applied via --unsafe-fixes and proven by import smoke + pytest.
#
# R5-ruff-b904-ramp: B904(raise-without-from) added as a SINGLE rule, not the whole
# `B` group. B904 has no autofix (the `from` target is a human choice), so the 7 boundary
# re-raises (_http_helpers.py x3, notifications.py x2, validators.py x2) were rewritten by
# hand this cycle — `from err` to preserve the cause (default), `from None` only for the
# one same-type rewrap where the original is noise (validators.py date parse). The rest of
# `B` (B008 FastAPI Depends-default, B905 zip-strict, ...) needs separate review → R6.
#
# R6-ruff-bugbear-sim-ramp: full `B` (bugbear) + `SIM` (simplify) added. src B
# fixed (B905 zip strict=True, B025 dup-except→Exception, B007 unused-loop-var);
# SIM via autofix (SIM117/300/102/108) + contextlib.suppress for SIM105. tests'
# B017 (pytest.raises(Exception)) is per-file-ignored (broad raises are idiomatic
# in tests).
#
# R7-ruff-e501-ramp: E501(line-too-long, 100) added. `ruff format` NOT adopted
# (would reformat 85/99 files; blame preserved instead). Real code lines were
# wrapped; files whose E501s are dominated by content that wraps badly — Korean
# system prompts / UI strings, test JSON fixtures — are per-file-ignored for
# E501 (wrapping Korean sentences hurts readability/meaning). C901 deferred → R8.
select = ["F", "BLE001", "I", "UP", "B", "SIM", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test code: unused imports (fixtures/registration), broad catch, broad
# pytest.raises(Exception) (B017), and long JSON-fixture lines (E501) are
# often intentional. Real bugs (F821/F841/F811) stay enforced.
"tests/**" = ["F401", "BLE001", "B017", "E501"]
# E501 exempt: these files' long lines are Korean prompt/UI string content
# (not code) where wrapping degrades readability. See R7 plan.
"api/chat.py" = ["E501"]
"dashboard/components/ai_section.py" = ["E501"]
"dashboard/components/webhook_admin/views.py" = ["E501"]
"dashboard/components/presets.py" = ["E501"]
"portal_settings_dialog.py" = ["E501"]

# ==========================================================
# Coverage — R3-ruff-ble001-coverage
# Baseline over core backend (api, shared). --cov-fail-under is intentionally
# NOT in pytest addopts: the full suite has known flaky tests (tmpdir race,
# rate-limit 60s timing). Apply the floor in CI only.
# ==========================================================
[tool.coverage.run]
# coverage-source-expansion (2026-06-15): measure api + shared + the tested
# pure dashboard helper (_parsing.py). Render/UI code (app.py, views, render
# components) needs a Streamlit runtime to exercise and is deliberately NOT
# measured — only the extracted, unit-tested logic. `source` lists dirs +
# the single helper file. (This intentionally lifts the earlier
# "source unchanged" invariant from ci-and-env-standardization.)
source = ["api", "shared", "dashboard"]
branch = true
# Only the extracted, unit-tested pure helper (_parsing.py) is measured in
# dashboard/. Render/UI code needs a Streamlit runtime to exercise and is
# excluded by listing it here (whitelist-via-omit: everything in dashboard
# except _parsing.py). A new dashboard file is measured only after being
# removed from this list — keeps the "measure what we test" intent explicit.
omit = [
    "*/__pycache__/*",
    "tests/*",
    "dashboard/app.py",
    "dashboard/data.py",
    "dashboard/views/*",
    "dashboard/components/__init__.py",
    "dashboard/components/ai_section.py",
    "dashboard/components/charts.py",
    "dashboard/components/layout.py",
    "dashboard/components/loading.py",
    "dashboard/components/notifications.py",
    "dashboard/components/presets.py",
    "dashboard/components/webhook_admin/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
# Registered markers (required by --strict-markers). pytest 9.1 errors on
# unregistered marks where 9.0 only warned; `timeout` is used by
# test_process_utils.py and is a no-op unless pytest-timeout is installed.
markers = [
    "timeout: per-test timeout in seconds (no-op unless pytest-timeout installed)",
]
# tmp_path base is controlled via PYTEST_DEBUG_TEMPROOT env var set in
# tests/conftest.py so that locked dirs from prior runs do not block startup
# (which is what --basetemp would attempt to wipe).
tmp_path_retention_policy = "all"
tmp_path_retention_count = 3
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::PendingDeprecationWarning",
]
