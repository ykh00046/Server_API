# Streamlit Theme Configuration
# ui-design-overhaul-v1 (2026-06-11): industrial blue/slate palette,
# full native theming (light + dark). This file is the SINGLE SOURCE OF
# TRUTH for app colors/typography — python-side CSS is minimal (see
# shared/ui/theme.py). Defining both [theme.light] and [theme.dark]
# exposes the native light/dark toggle in the app settings menu.

[theme]
base = "light"
# NOTE(1.58): these three keys are only valid at the top [theme] level —
# Streamlit warns "not a valid config option" if placed under
# [theme.light]/[theme.dark] variants.
showSidebarBorder = true
baseFontSize = 14
chartCategoricalColors = ["#2563eb", "#0d9488", "#f59e0b", "#7c3aed", "#dc2626", "#0891b2", "#64748b"]

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
linkColor = "#2563eb"
borderColor = "#e2e8f0"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
linkUnderline = false
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
codeFontSize = "13px"
blueColor = "#2563eb"
greenColor = "#059669"
redColor = "#dc2626"
orangeColor = "#ea580c"
yellowColor = "#ca8a04"
violetColor = "#7c3aed"
grayColor = "#64748b"
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f8fafc"

[theme.light.sidebar]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
borderColor = "#e2e8f0"

[theme.dark]
primaryColor = "#3b82f6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
linkColor = "#60a5fa"
borderColor = "#334155"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
linkUnderline = false
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
codeFontSize = "13px"
blueColor = "#60a5fa"
greenColor = "#34d399"
redColor = "#f87171"
orangeColor = "#fb923c"
yellowColor = "#facc15"
violetColor = "#a78bfa"
grayColor = "#94a3b8"
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1e293b"

[theme.dark.sidebar]
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#1e293b"
borderColor = "#334155"
