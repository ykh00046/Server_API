name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff (lock-pinned version)
        run: pip install "ruff==$(grep -E '^ruff==' requirements.lock.txt | cut -d= -f3 | tr -d '\r')"
      - name: Ruff gate (select inherited from pyproject.toml)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies (locked)
        run: pip install -r requirements.lock.txt
      # The runner has no ERP database. Integration tests hit /records,/items,
      # /summary against the live DB path, so create an EMPTY production_records
      # schema (see docs/specs/operations_manual.md, "new Live DB" step).
      # Tests are written to accept empty result sets (200/404 tolerant).
      - name: Create empty fixture DB
        run: |
          mkdir -p database
          python -c "
          import sqlite3
          conn = sqlite3.connect('database/production_analysis.db')
          conn.execute('''
              CREATE TABLE IF NOT EXISTS production_records (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  production_date TEXT NOT NULL,
                  lot_number TEXT,
                  item_code TEXT NOT NULL,
                  item_name TEXT,
                  good_quantity REAL DEFAULT 0
              )
          ''')
          conn.commit()
          conn.close()
          "
      # Coverage floor lives here ON PURPOSE, not in pyproject addopts --
      # see pyproject.toml [tool.coverage] comment (local runs stay floor-free).
      # Baseline 2026-06-10: 71% -> floor 66. Raised 2026-06-15 to 72 after
      # dead-code removal (coverage-blindspots-v1, ->75%) + source expansion
      # (coverage-source-expansion: +dashboard _parsing.py). -3pp runner margin.
      - name: Pytest + coverage floor (CI-only)
        run: python -m pytest tests/ -q --cov --cov-report=term --cov-fail-under=72
